<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores Amarillas para Ti 💛</title>

    <!-- Librerías de Three.js, OrbitControls y Tween.js para el Zoom suave -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* PANTALLA INICIAL TIPO CARTA */
        #start-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #261238 0%, #05010a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 1.2s ease, visibility 1.2s;
        }

        .card-box {
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 24px;
            padding: 40px 30px;
            text-align: center;
            background: rgba(20, 10, 30, 0.75);
            backdrop-filter: blur(15px);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.25);
            max-width: 90%;
            width: 380px;
        }

        .card-box .icon-top {
            font-size: 14px;
            letter-spacing: 2px;
            color: #ffd700;
            margin-bottom: 8px;
            opacity: 0.9;
        }

        .card-box h1 {
            color: #fff;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .card-box p {
            color: #ffd700;
            font-style: italic;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .character-svg {
            width: 130px;
            height: 130px;
            margin: 10px 0;
        }

        .btn-open {
            margin-top: 15px;
            background: linear-gradient(45deg, #ffd700, #ff9900);
            border: none;
            padding: 14px 32px;
            border-radius: 30px;
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 20px #ffd700;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-open:hover {
            transform: scale(1.06);
            box-shadow: 0 0 30px #ffd700;
        }

        /* TITULO PRINCIPAL Y BOTON DE RETORNO EN EL UNIVERSO */
        #title-3d {
            position: fixed;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 15px #ffd700, 0 0 30px #ff8800;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.5s ease;
            z-index: 10;
            text-align: center;
            width: 100%;
        }

        #btn-reset {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease, background 0.3s;
        }

        #btn-reset:hover {
            background: rgba(255, 215, 0, 0.4);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <!-- PANTALLA INICIAL -->
    <div id="start-screen">
        <div class="card-box">
            <div class="icon-top">∞ LOVE YOU</div>
            <h1>Flores Amarillas</h1>
            <p>para ti</p>

            <svg class="character-svg" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="28" fill="#ffffff"/>
                <circle cx="42" cy="45" r="3" fill="#000000"/>
                <circle cx="58" cy="45" r="3" fill="#000000"/>
                <ellipse cx="50" cy="52" rx="4" ry="2" fill="#ff9999"/>
                <!-- Bouquet de girasoles -->
                <circle cx="68" cy="62" r="12" fill="#ffd700"/>
                <circle cx="68" cy="62" r="5" fill="#5c3a21"/>
                <circle cx="58" cy="68" r="9" fill="#ffae00"/>
                <circle cx="58" cy="68" r="4" fill="#5c3a21"/>
            </svg>

            <br>
            <button class="btn-open" onclick="abrirUniverso()">ABRIR UNIVERSO ✨</button>
        </div>
    </div>

    <!-- ELEMENTOS EN PANTALLA SOBRE EL UNIVERSO -->
    <div id="title-3d">Te amo</div>
    <button id="btn-reset" onclick="resetCamara()">🔍 Vista General</button>

    <!-- CONTENEDOR 3D -->
    <div id="canvas-container"></div>

    <!-- MUSICA DE FONDO -->
    <audio id="bg-audio" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=romantic-piano-112199.mp3" type="audio/mpeg">
    </audio>

    <script>
        let scene, camera, renderer, controls, galaxyGroup;
        const clickableObjects = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // Lista de frases románticas que flotarán en 3D
        const frases = [
            "Te amo", "Mi persona favorita", "Eres mi luz", "Para siempre",
            "Mi girasol", "Mi lugar feliz", "Mi destino", "Juntos siempre",
            "Tu sonrisa ilumina mi mundo", "Eres mi vida", "Amor de mi vida", "Siempre tú",
            "Eres mi razón de sonreír", "Mi sol de cada día", "Gracias por existir"
        ];

        // Fotos de girasoles/flores amarillas
        const imagenes = [
            'https://images.unsplash.com/photo-1597848212624-a19eb35e2651?w=400',
            'https://images.unsplash.com/photo-1543257580-7269da773bf5?w=400',
            'https://images.unsplash.com/photo-1563245372-f21724e3856d?w=400',
            'https://images.unsplash.com/photo-1470240731273-7821a6eeb6bd?w=400'
        ];

        function init() {
            const container = document.getElementById('canvas-container');

            // Escena y Cámara
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 15, 30);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Controles de Orbita (Permite zoom con rueda/pellizco y rotar)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 60;
            controls.minDistance = 2;

            galaxyGroup = new THREE.Group();
            scene.add(galaxyGroup);

            // 1. Núcleo brillante
            const coreGeo = new THREE.SphereGeometry(2.2, 32, 32);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
            galaxyGroup.add(new THREE.Mesh(coreGeo, coreMat));

            const glowGeo = new THREE.SphereGeometry(2.9, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.35 });
            galaxyGroup.add(new THREE.Mesh(glowGeo, glowMat));

            // 2. Partículas de la Espiral
            const count = 7000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const cols = new Float32Array(count * 3);

            const cGold = new THREE.Color(0xffd700);
            const cOrange = new THREE.Color(0xff7700);

            for (let i = 0; i < count; i++) {
                const r = Math.pow(Math.random(), 2) * 20 + 2;
                const theta = r * 1.6 + (i % 2 === 0 ? 0 : Math.PI);
                
                pos[i * 3] = r * Math.cos(theta) + (Math.random() - 0.5) * 1.2;
                pos[i * 3 + 1] = (Math.random() - 0.5) * (18 / r);
                pos[i * 3 + 2] = r * Math.sin(theta) + (Math.random() - 0.5) * 1.2;

                const mixed = cGold.clone().lerp(cOrange, Math.random());
                cols[i * 3] = mixed.r;
                cols[i * 3 + 1] = mixed.g;
                cols[i * 3 + 2] = mixed.b;
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));

            const mat = new THREE.PointsMaterial({ size: 0.11, vertexColors: true, transparent: true, opacity: 0.8 });
            galaxyGroup.add(new THREE.Points(geo, mat));

            // 3. Crear Frases Flotantes en Canvas 2D convertidas a Texturas 3D
            frases.forEach((texto, i) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 512;
                canvas.height = 128;

                ctx.font = 'Bold 36px Arial';
                ctx.fillStyle = '#ffd700';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#ff8800';
                ctx.shadowBlur = 12;
                ctx.fillText(texto, 256, 70);

                const texture = new THREE.CanvasTexture(canvas);
                const pMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
                const sprite = new THREE.Sprite(pMat);

                const angle = (i / frases.length) * Math.PI * 2;
                const dist = 5 + Math.random() * 12;
                sprite.position.set(Math.cos(angle) * dist, (Math.random() - 0.5) * 6, Math.sin(angle) * dist);
                sprite.scale.set(6, 1.5, 1);

                galaxyGroup.add(sprite);
                clickableObjects.push(sprite);
            });

            // 4. Crear Marcos de Fotos Cuadrados
            const loader = new THREE.TextureLoader();
            imagenes.forEach((url, i) => {
                loader.load(url, (tex) => {
                    const planeGeo = new THREE.PlaneGeometry(2.8, 2.8);
                    const planeMat = new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide });
                    const mesh = new THREE.Mesh(planeGeo, planeMat);

                    const angle = (i / imagenes.length) * Math.PI * 2 + 0.5;
                    const r = 9;
                    mesh.position.set(Math.cos(angle) * r, 1, Math.sin(angle) * r);
                    mesh.lookAt(0, 0, 0);

                    // Marco dorado alrededor
                    const border = new THREE.Mesh(
                        new THREE.PlaneGeometry(3.0, 3.0),
                        new THREE.MeshBasicMaterial({ color: 0xffd700, side: THREE.DoubleSide })
                    );
                    border.position.z = -0.01;
                    mesh.add(border);

                    galaxyGroup.add(mesh);
                    clickableObjects.push(mesh);
                });
            });

            // Detectar Clics para Zoom
            window.addEventListener('click', onClick);
            window.addEventListener('resize', onWindowResize);

            // Ciclo de Renderizado
            function animate(time) {
                requestAnimationFrame(animate);
                TWEEN.update();
                controls.update();

                // Rotación suave continua si no hay zoom activo
                if (!window.zoomActivo) {
                    galaxyGroup.rotation.y += 0.0025;
                }

                renderer.render(scene, camera);
            }
            animate();
        }

        // Función para acercar la cámara al hacer clic (Zoom Interactivo)
        function onClick(event) {
            // Prevenir clic si se pulsa la interfaz
            if (event.target.tagName === 'BUTTON') return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);

            if (intersects.length > 0) {
                const target = intersects[0].object;
                window.zoomActivo = true;

                // Obtener posición del objeto en coordenadas del mundo
                const worldPos = new THREE.Vector3();
                target.getWorldPosition(worldPos);

                // Calcular posición final de la cámara frente al objeto
                const targetCamPos = worldPos.clone().add(new THREE.Vector3(0, 0, 5));

                // Animación suave de la cámara con Tween
                new TWEEN.Tween(camera.position)
                    .to(targetCamPos, 1200)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();

                new TWEEN.Tween(controls.target)
                    .to(worldPos, 1200)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();

                document.getElementById('btn-reset').style.opacity = '1';
                document.getElementById('btn-reset').style.pointerEvents = 'auto';
            }
        }

        // Restablecer Cámara a Vista General
        function resetCamara() {
            window.zoomActivo = false;

            new TWEEN.Tween(camera.position)
                .to({ x: 0, y: 15, z: 30 }, 1200)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            new TWEEN.Tween(controls.target)
                .to({ x: 0, y: 0, z: 0 }, 1200)
                .easing(TWEEN.Easing.Cubic.Out)
                .start();

            document.getElementById('btn-reset').style.opacity = '0';
            document.getElementById('btn-reset').style.pointerEvents = 'none';
        }

        function abrirUniverso() {
            const startScreen = document.getElementById('start-screen');
            const title = document.getElementById('title-3d');
            const audio = document.getElementById('bg-audio');

            audio.play().catch(() => {});

            startScreen.style.opacity = '0';
            setTimeout(() => {
                startScreen.style.display = 'none';
                init();
                title.style.opacity = '1';
            }, 1200);
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
